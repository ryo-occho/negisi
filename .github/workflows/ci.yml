name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: ESLint and Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  application-build:
    name: TypeScript and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for database-related changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            files=$(git ls-tree -r --name-only "$GITHUB_SHA")
          else
            files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          if grep -Eq '^(supabase/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "No database-related changes; skipping database setup and tests." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.database == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.database == 'true'
      - name: Start local database and apply migrations
        if: steps.changes.outputs.database == 'true'
        timeout-minutes: 5
        run: npm run db:start
      - name: Run pgTAP tests
        if: steps.changes.outputs.database == 'true'
        timeout-minutes: 3
        run: npm run test:db
      - name: Stop local database
        if: always() && steps.changes.outputs.database == 'true'
        run: npm run db:stop -- --no-backup
